apiVersion: apps/v1
kind: Deployment
metadata:
  name: yengec-developer-hub
  labels:
    app: yengec-developer-hub
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: yengec-developer-hub
  template:
    metadata:
      labels:
        app: yengec-developer-hub
    spec:
      imagePullSecrets:
        - name: dockerhub-pull-secret
      containers:
        - name: yengec-developer-hub
          image: salyangoz/yengec-developer-hub:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: yengec-developer-hub
spec:
  type: ClusterIP
  selector:
    app: yengec-developer-hub
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yengec-developer-hub
spec:
  ingressClassName: traefik
  rules:
    - host: dev.yengec.co
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yengec-developer-hub
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: yengec-developer-hub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: yengec-developer-hub
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
