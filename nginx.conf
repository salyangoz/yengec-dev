server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client-side routes (/rehber, /referans) serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
        # Never cache the HTML entrypoint: it references hashed asset filenames
        # that change every deploy. A cached index.html would request a now-404
        # bundle and white-screen until a hard refresh.
        add_header Cache-Control "no-cache";
    }

    # Hashed, immutable build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
